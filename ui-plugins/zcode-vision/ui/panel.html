<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vision 图片卡片</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #0969da; --hover: #eef1f5;
    --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: #14171a; --panel: #1c2126; --text: #e6edf3; --muted: #9198a1;
    --border: #323941; --accent: #4493f8; --hover: #262c33;
  }
  * { box-sizing: border-box; }
  /* html 必须显式透明：不写这条 body 再透明也挡不住底层画布的黑/白 */
  html { background: transparent; }
  /* SDK 会按主题给根元素设内联 color-scheme:dark——Chromium 在深色 color-scheme
     下把画布涂成纯黑（实测 18,18,18，html/body 写透明都盖不住），壁纸根本透不出来。
     面板控件都是自绘的、不依赖原生深色控件，用 !important 压回 light（内联样式
     压不过样式表 !important），画布恢复透明 */
  :root { color-scheme: light !important; }
  body {
    /* 背景透明：卡片容器或壁纸从底下透出（zcode-pro 壁纸引擎场景） */
    margin: 0; padding: 12px; background: transparent; color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .qa { margin-bottom: 10px; background: color-mix(in srgb, var(--panel) 72%, transparent); border-radius: 8px; padding: 6px 10px; }
  .qa .q { color: var(--muted); margin-bottom: 4px; }
  .qa .q b { color: var(--text); font-weight: 600; }
  .qa .a { word-break: break-word; }
  .qa .a h3 { font-size: 13px; margin: 8px 0 4px; }
  .qa .a p { margin: 4px 0; }
  .qa .a ul, .qa .a ol { margin: 4px 0; padding-left: 18px; }
  .qa .a li { margin: 2px 0; }
  .qa .a code {
    font-family: var(--mono); font-size: 12px;
    background: rgba(125, 125, 125, 0.15); border-radius: 4px; padding: 0 4px;
  }
  .qa .a table { border-collapse: collapse; margin: 6px 0; }
  .qa .a th, .qa .a td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  /* 图片区默认收起：问答文字直接可读，显隐只由 .collapsed 类控制 */
  #tools.collapsed { display: none; }
  #tools { margin-top: 8px; }
  .imagewrap {
    display: inline-block; max-width: 100%;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden; line-height: 0;
  }
  .imagewrap img { max-width: 100%; max-height: 48vh; }
  button {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  /* 深色卡片用深灰实底：宿主切浅色后，已打开的旧卡片收不到换肤通知，仍按
     深色样式渲染——浅色雾面在浅色宿主/亮壁纸下白字看不清（实测截图发灰）。
     实底保证亮暗背景与亮暗宿主下文字都清楚。磨砂做不了：backdrop-filter 在
     独立文档里够不到宿主壁纸，加在宿主页的 webview 元素上实测同样无效 */
  [data-theme="dark"] .qa { background: rgba(30, 35, 41, 0.86); }
  [data-theme="dark"] button { background: rgba(30, 35, 41, 0.88); }
  [data-theme="dark"] button:hover { background: rgba(56, 63, 71, 0.9); }
  .hint { color: var(--muted); font-size: 12px; }
  #err { color: #cf222e; font-size: 12px; white-space: pre-wrap; margin-top: 6px; }
  [data-theme="dark"] #err { color: #f85149; }
  .path { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; word-break: break-all; }
</style>
</head>
<body>
  <div id="placeholder" class="hint">等待 vision_ask 调用后显示图片与问答。</div>
  <section id="card" style="display:none;">
    <div class="qa">
      <div class="q">问：<b id="q"></b> <span id="meta" class="hint"></span></div>
      <div class="a" id="a"></div>
    </div>
    <button id="tools-toggle" aria-expanded="false">显示图片</button>
    <div id="tools" class="collapsed">
      <div class="imagewrap" id="wrap">
        <img id="img" alt="被识别的图片" />
      </div>
      <div class="path" id="path"></div>
    </div>
  </section>
  <div id="err"></div>
  <script>/*__APP_JS__*/</script>
</body>
</html>
