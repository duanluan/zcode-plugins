<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vision 图片卡片</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #0969da;
    --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: #14171a; --panel: #1c2126; --text: #e6edf3; --muted: #9198a1;
    --border: #323941; --accent: #4493f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .qa { margin-bottom: 10px; }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  .head .q { color: var(--muted); margin: 0; flex: 1; min-width: 0; }
  .head .q b { color: var(--text); font-weight: 600; }
  /* 收起时问题只显示一行，识别全文与图片藏在展开区里 */
  #card.collapsed .head .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card.collapsed #detail { display: none; }
  #toggle { flex-shrink: 0; }
  .qa .a { word-break: break-word; }
  .qa .a h3 { font-size: 13px; margin: 8px 0 4px; }
  .qa .a p { margin: 4px 0; }
  .qa .a ul, .qa .a ol { margin: 4px 0; padding-left: 18px; }
  .qa .a li { margin: 2px 0; }
  .qa .a code {
    font-family: var(--mono); font-size: 12px;
    background: rgba(125, 125, 125, 0.15); border-radius: 4px; padding: 0 4px;
  }
  .imagewrap {
    position: relative; display: inline-block; max-width: 100%;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden; line-height: 0;
    user-select: none; cursor: crosshair;
  }
  .imagewrap img { max-width: 100%; max-height: 48vh; }
  #sel {
    position: absolute; border: 2px solid var(--accent); background: rgba(9, 105, 218, 0.12);
    display: none; pointer-events: none; border-radius: 2px;
  }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  .hint { color: var(--muted); font-size: 12px; }
  #status { font-size: 12px; color: var(--accent); }
  #err { color: #cf222e; font-size: 12px; white-space: pre-wrap; margin-top: 6px; }
  [data-theme="dark"] #err { color: #f85149; }
  .path { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; word-break: break-all; }
</style>
</head>
<body>
  <div id="placeholder" class="hint">等待 vision_ask 调用后显示图片与问答。</div>
  <section id="card" class="collapsed" style="display:none;">
    <div class="head">
      <div class="q">问：<b id="q"></b> <span id="meta" class="hint"></span></div>
      <button id="toggle" aria-expanded="false">展开</button>
    </div>
    <div id="detail">
      <div class="qa">
        <div class="a" id="a"></div>
      </div>
      <div class="imagewrap" id="wrap">
        <img id="img" alt="被识别的图片" />
        <div id="sel"></div>
      </div>
      <div class="actions">
        <button id="ref">引用选区到对话</button>
        <span class="hint">在图上拖动框选；不框选则引用整图。引用后接着提问即可。</span>
        <span id="status"></span>
      </div>
      <div class="path" id="path"></div>
    </div>
  </section>
  <div id="err"></div>
  <script>/*__APP_JS__*/</script>
</body>
</html>
